version: 2
updates:
  # JS/TS toolchain — root package.json + pnpm-lock.yaml.
  # Scoped to "/" so the eval/cases fixture package.json is left untouched.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Rust native addon — crates/quoll-core.
  - package-ecosystem: "cargo"
    directory: "/crates/quoll-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # ONE group for the whole crate, majors included. The oxc_* crates only
      # compile against their own version — a PR bumping one of them alone
      # puts two incompatible copies of oxc_ast in the lock file and fails the
      # build (that is what #22-#25 did). An `oxc*`-only group did not hold:
      # oxc_sourcemap still landed in the update-types group, so the split is
      # prevented structurally here instead, by leaving nothing to split into.
      cargo:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
