name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref so a quick re-push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The instrumentation core is a Rust cdylib (edition 2024 -> needs a
      # recent stable). rust-cache keys on crates/quoll-core/Cargo.lock.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/quoll-core

      # pnpm must be set up before setup-node so the `cache: pnpm` step can find
      # it. Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # >=22.18 strips TS types natively; the eval harness imports .ts directly
          cache: pnpm

      # Deno runs the sandboxed runner that the eval harness spawns. The harness
      # defaults DENO to "deno", which setup-deno puts on PATH.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      # Style gate: oxfmt (JS/TS) + cargo fmt --check (Rust). Fails fast before
      # the slower build/eval steps. rustfmt ships with rust-toolchain@stable.
      - name: Format check
        run: pnpm run fmt:check

      # Lint gate: oxlint (JS/TS, --deny-warnings) + clippy (Rust, -D warnings).
      # Both fail on any warning so the gate can't quietly accumulate debt.
      - name: Lint (oxlint)
        run: pnpm run lint
      - name: Lint (clippy)
        run: pnpm run lint:rust

      # cargo build --release -> native/quoll-core.linux-x64.node (loaded by the
      # instrument pipeline; the eval harness silently falls back to identity if
      # it's missing, so building it first is what makes the eval meaningful).
      - name: Build native core
        run: pnpm run build:core

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build extension
        run: pnpm run build

      # Guards the source/bundle fidelity gap: the eval harness imports the TS
      # under node-ESM (import.meta.url defined), but the shipped extension runs
      # the esbuild CJS bundle (import.meta stubbed). Asserts the napi binary
      # still loads from the bundled form, so a run never silently degrades.
      - name: Native-bundle check
        run: pnpm run check:bundle

      - name: Golden-eval harness
        run: pnpm run eval

  # Smoke + glue tests in a real VS Code instance (@vscode/test-electron). These
  # exercise only the extension-host wiring (activation, commands, view, config)
  # — the instrument/runner paths fall back gracefully, so this job needs
  # neither Rust nor Deno, which is why the matrix can stay lean.
  vscode-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pretest builds the extension + the test bundle and typechecks the suite.
      # On Linux the VS Code Electron instance needs a virtual display.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test
      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        run: pnpm test
